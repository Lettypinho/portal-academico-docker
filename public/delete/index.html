<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portal Acadêmico</title>

<link rel="stylesheet" href="style.css">
</head>


<body>

    <header>
        <h1>Portal Acadêmico</h1>
        <p>Consulta de alunos e cursos</p>
    </header>

    <main>

        <section class="card">

            <h2>Alunos cadastrados</h2>

            <button onclick="carregarAlunos()">
                Carregar alunos
            </button>

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Email</th>
                        <th>Nascimento</th>
                        <th>Curso</th>
                    </tr>
                </thead>

                <tbody id="tabela-alunos">

                </tbody>

            </table>

        </section>

    </main>

    <script src="app.js"></script>

</body>

</html>
