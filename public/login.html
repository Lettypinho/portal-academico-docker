<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | SIA</title>

    <link
        rel="stylesheet"
        href="/css/style.css?v=3"
    >
</head>

<body class="auth-page">

    <main class="auth-container">

        <section class="auth-brand">

            <div class="auth-logo-container">
                <img
                    src="/assets/logo-sia.png"
                    alt="SIA - Sistema de Indicadores Acadêmicos"
                    class="auth-logo"
                >
            </div>

            <h1>
                Transforme dados acadêmicos
                em melhores decisões.
            </h1>

            <p>
                Consulte indicadores, acompanhe resultados
                e compare o desempenho acadêmico entre
                diferentes instituições de ensino.
            </p>

        </section>


        <section class="auth-card">

            <div class="auth-card-header">

                <span class="auth-tag">
                    Bem-vindo ao SIA
                </span>

                <h2>Entrar</h2>

                <p class="auth-subtitle">
                    Acesse sua conta para continuar.
                </p>

            </div>


            <form id="form-login">

                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="seu@email.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="senha">
                        Senha
                    </label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="senha"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="senha"
                        >
                            Mostrar
                        </button>

                    </div>

                </div>


                <div
                    id="mensagem"
                    class="form-message"
                ></div>


                <button
                    type="submit"
                    class="btn-primary"
                >
                    Entrar
                </button>

            </form>


            <p class="auth-footer">

                Ainda não possui uma conta?

                <a href="/cadastro.html">
                    Criar conta
                </a>

            </p>

        </section>

    </main>

    <script src="/js/auth.js"></script>

</body>

</html>
