<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | SIA</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="auth-page">

    <main class="auth-container">

        <section class="auth-brand">
            <div class="brand-logo">SIA</div>

            <h1>
                Sistema de Indicadores Acadêmicos
            </h1>

            <p>
                Dados acadêmicos transformados em indicadores
                para melhores decisões.
            </p>
        </section>

        <section class="auth-card">

            <h2>Entrar</h2>

            <p class="auth-subtitle">
                Acesse sua conta para continuar.
            </p>

            <form id="form-login">

                <div class="form-group">
                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="seu@email.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="senha">
                        Senha
                    </label>

                    <div class="password-container">
                        <input
                            type="password"
                            id="senha"
                            placeholder="Digite sua senha"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="senha"
                        >
                            Mostrar
                        </button>
                    </div>
                </div>

                <div
                    id="mensagem"
                    class="form-message"
                ></div>

                <button
                    type="submit"
                    class="btn-primary"
                >
                    Entrar
                </button>

            </form>

            <p class="auth-footer">
                Ainda não possui uma conta?

                <a href="/cadastro.html">
                    Criar conta
                </a>
            </p>

        </section>

    </main>

    <script src="/js/auth.js"></script>

</body>
</html>
