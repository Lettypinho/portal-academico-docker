<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastro | SIA</title>

    <link
        rel="stylesheet"
        href="/css/style.css?v=3"
    >
</head>

<body class="auth-page">

    <main class="auth-container">

        <section class="auth-brand">

            <div class="auth-logo-container">
                <img
                    src="/assets/logo-sia.png"
                    alt="SIA - Sistema de Indicadores Acadêmicos"
                    class="auth-logo"
                >
            </div>

            <h1>
                Explore o desempenho
                acadêmico das instituições.
            </h1>

            <p>
                Crie sua conta para pesquisar universidades,
                explorar cursos e comparar indicadores
                acadêmicos públicos.
            </p>

        </section>


        <section class="auth-card">

            <div class="auth-card-header">

                <span class="auth-tag">
                    Criar acesso
                </span>

                <h2>Criar conta</h2>

                <p class="auth-subtitle">
                    Preencha seus dados para começar.
                </p>

            </div>


            <form id="form-cadastro">

                <div class="form-group">

                    <label for="nome">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Seu nome"
                        autocomplete="name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="seu@email.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="senha">
                        Senha
                    </label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="senha"
                            minlength="6"
                            placeholder="Mínimo de 6 caracteres"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="senha"
                        >
                            Mostrar
                        </button>

                    </div>

                </div>


                <div class="form-group">

                    <label for="confirmar-senha">
                        Confirmar senha
                    </label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="confirmar-senha"
                            minlength="6"
                            placeholder="Digite novamente"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="confirmar-senha"
                        >
                            Mostrar
                        </button>

                    </div>

                </div>


                <div
                    id="mensagem"
                    class="form-message"
                ></div>


                <button
                    type="submit"
                    class="btn-primary"
                >
                    Criar conta
                </button>

            </form>


            <p class="auth-footer">

                Já possui uma conta?

                <a href="/login.html">
                    Entrar
                </a>

            </p>

        </section>

    </main>

    <script src="/js/auth.js"></script>

</body>

</html>
